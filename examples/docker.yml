# Docker-only configuration.
# Build the runner image: docker build -t outrunner-runner runner/
url: https://github.com/your-org/your-repo
# token_file: /etc/outrunner/token

runners:
  linux:
    labels: [self-hosted, linux]
    # Optional: make the host single-use and exit after safe cleanup.
    # max_jobs: 1
    # Optionally publish an atomic JSON receipt only after all runners are
    # stopped and deregistered. A write failure keeps admission closed and
    # prevents the scale set from reporting drained.
    # drain_receipt:
    #   path: /var/lib/outrunner/drain-receipt.json
    #   identity:
    #     provider: gcp
    #     instance_id: "1234567890"
    docker:
      image: outrunner-runner:latest
      # Optional: share the host network namespace. This is useful when jobs
      # start sibling containers through a mounted Docker socket and expect
      # their published ports to be reachable on localhost.
      # host_network: true
      # Optional: bind mount a host directory into every container.
      # Useful for a persistent build cache (e.g. vcpkg, cargo, gradle).
      # mounts:
      #   - source: /var/cache/vcpkg
      #     target: /opt/vcpkg-cache
      #   - source: /var/cache/cargo
      #     target: /opt/cargo-cache
      #     read_only: false
